<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#25356a"><link rel="manifest" href="manifest.json"><title>My Life Manager</title><style>body{margin:0;font:16px system-ui;background:#f3f5fc;color:#18213a}header{padding:25px;background:linear-gradient(120deg,#182b5b,#6754c5);color:white;border-radius:0 0 25px 25px}h1{margin:0}main{padding:16px;max-width:750px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.panel{background:white;border:0;border-radius:16px;padding:18px;box-shadow:0 3px 15px #10143a16}.card{text-align:left;font-size:17px;color:inherit}.card b{display:block;font-size:28px}.panel{margin-top:16px}input,textarea{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #cbd1e3;border-radius:9px}button{cursor:pointer}.primary{padding:12px;border:0;border-radius:9px;background:#594ac0;color:white}.small{border:0;border-radius:8px;padding:7px;background:#e9eafa;margin:4px}.row{padding:12px 0;border-bottom:1px solid #ddd;overflow-wrap:anywhere}.muted{color:#69748b;font-size:13px}.dark{background:#101726;color:white}.dark .card,.dark .panel{background:#222c45;color:white}.dark input,.dark textarea{background:#172137;color:white}</style></head><body><header><h1>✦ My Life Manager</h1><p id="tag">Your personal space • Offline ready</p><button class="small" onclick="lang=lang==='en'?'te':'en';localStorage.setItem('ml_lang',lang);render()">తెలుగు / English</button></header><main><div id="cards" class="grid"></div><section class="panel" id="work"></section><section class="panel"><h3>⚙️ Backup & Settings</h3><button class="primary" onclick="backup()">Download backup</button><p>Restore backup: <input type="file" accept=".json" onchange="restoreFile(event)"></p><button class="small" onclick="document.body.classList.toggle('dark')">🌙 Theme</button><p class="muted">For Google Drive backup, upload the downloaded JSON file manually. Your personal entries stay on this device. Clearing browser data can erase them.</p></section></main><script>const kinds=['tasks','notes','expenses','diary','goals'],icons=['✅','📝','💰','📔','🎯'],names={en:['Tasks','Notes','Expenses','Diary','Goals'],te:['పనులు','నోట్స్','ఖర్చులు','డైరీ','లక్ష్యాలు']};let lang=localStorage.getItem('ml_lang')||'en',active='tasks',db;try{db=JSON.parse(localStorage.getItem('ml_data'))||{}}catch{db={}}for(let k of kinds)if(!Array.isArray(db[k]))db[k]=[];function save(){localStorage.setItem('ml_data',JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('tag').textContent=lang==='en'?'Your personal space • Offline ready':'మీ వ్యక్తిగత స్థలం • ఆఫ్‌లైన్‌లో పనిచేస్తుంది';document.getElementById('cards').innerHTML=kinds.map((k,i)=>'<button class="card" onclick="openTab(\''+k+'\')"><b>'+icons[i]+'</b>'+names[lang][i]+' ('+db[k].length+')</button>').join('');openTab(active)}function openTab(k){active=k;let i=kinds.indexOf(k);document.getElementById('work').innerHTML='<h2>'+icons[i]+' '+names[lang][i]+'</h2><form id="form"><input id="title" required maxlength="150" placeholder="Title / పేరు">'+(k==='expenses'?'<input id="amount" type="number" min="0" step="0.01" required placeholder="Amount ₹">':'')+'<textarea id="details" placeholder="Details / వివరాలు"></textarea><button class="primary">+ Add / జోడించు</button></form><div id="entries"></div>';document.getElementById('form').onsubmit=e=>{e.preventDefault();let title=document.getElementById('title').value.trim();if(!title)return;db[k].unshift({id:String(Date.now())+Math.random(),title,details:document.getElementById('details').value,amount:k==='expenses'?Number(document.getElementById('amount').value):null,done:false,date:new Date().toLocaleDateString()});save();render()};document.getElementById('entries').innerHTML=db[k].map(x=>'<div class="row"><strong>'+esc(x.title)+'</strong> '+(k==='expenses'?'₹'+Number(x.amount||0).toFixed(2):'')+'<div>'+esc(x.details)+'</div><span class="muted">'+esc(x.date)+'</span> '+(['tasks','goals'].includes(k)?'<button class="small" onclick="doneItem(\''+k+'\',\''+x.id+'\')">'+(x.done?'✓ Done':'○ Pending')+'</button>':'')+'<button class="small" onclick="editItem(\''+k+'\',\''+x.id+'\')">✎</button><button class="small" onclick="deleteItem(\''+k+'\',\''+x.id+'\')">✕</button></div>').join('')||'<p class="muted">No entries yet / ఇంకా వివరాలు లేవు</p>'}function deleteItem(k,id){if(confirm('Delete this entry?')){db[k]=db[k].filter(x=>x.id!==id);save();render()}}function doneItem(k,id){let x=db[k].find(x=>x.id===id);if(x)x.done=!x.done;save();render()}function editItem(k,id){let x=db[k].find(x=>x.id===id);if(!x)return;let t=prompt('Title',x.title);if(t===null||!t.trim())return;let d=prompt('Details',x.details);if(d===null)return;let a=x.amount;if(k==='expenses'){a=prompt('Amount',x.amount);if(a===null||!Number.isFinite(Number(a))||Number(a)<0)return}Object.assign(x,{title:t.trim(),details:d,amount:k==='expenses'?Number(a):null});save();render()}function backup(){let blob=new Blob([JSON.stringify({app:'My Life Manager',data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-life-manager-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restoreFile(e){try{let x=JSON.parse(await e.target.files[0].text());if(x.app!=='My Life Manager'||!kinds.every(k=>Array.isArray(x.data[k])))throw Error();if(confirm('Replace current data?')){db=x.data;save();render()}}catch{alert('Invalid backup file')}e.target.value=''}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render()</script></body></html>
